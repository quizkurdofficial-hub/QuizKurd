  <style>

    .btn-gold-gradient {
      background: linear-gradient(135deg, #FFD700 0%, #E5B869 50%, #D4A574 100%);
      color: #0A1931; font-weight: 900; border-radius: 16px;
      box-shadow: 0 8px 25px rgba(212, 165, 116, 0.35);

    .btn-gold-gradient:hover {

      outline: none; transition: all 0.2s;
    }
    .qk-input-2026:focus {
      border-color: #FFD700;
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.35), 0 0 0 3px rgba(212, 165, 116, 0.2);

      background: rgba(18, 37, 67, 0.85);

    .qk-input-2026::placeholder { color: #8292A6; font-weight: 500; }
    .float-item { animation: floating 4s ease-in-out infinite; }
    .float-item-delayed { animation: floating 5s ease-in-out 1.5s infinite; }
    @keyframes floating {

    #toast {

  <script>
    const MASTER_CODE = "BAHDINI-MAMOSTA-2026";
    const LOCK_MINUTES = 5;

    const DB = {
      getTeachers: () => JSON.parse(localStorage.getItem('qk_T2') || '[]'),
      saveTeachers: (d) => localStorage.setItem('qk_T2', JSON.stringify(d)),
      getQuizzes: () => JSON.parse(localStorage.getItem('qk_Q2') || '[]'),
      saveQuizzes: (d) => localStorage.setItem('qk_Q2', JSON.stringify(d)),
      getResults: () => JSON.parse(localStorage.getItem('qk_R2') || '[]'),
      saveResults: (d) => localStorage.setItem('qk_R2', JSON.stringify(d)),
      getCurrTeacher: () => {
        try { return JSON.parse(localStorage.getItem('qk_curr_teacher')); } catch(e){ return null; }
      },
      setCurrTeacher: (t) => {
        if(t) localStorage.setItem('qk_curr_teacher', JSON.stringify(t));
        else localStorage.removeItem('qk_curr_teacher');
      },
      getLockTime: () => parseInt(localStorage.getItem('lockTime') || '0', 10),
      setLockTime: (ts) => localStorage.setItem('lockTime', ts.toString()),
      getFails: () => parseInt(localStorage.getItem('qk_fails') || '0', 10),
      setFails: (n) => localStorage.setItem('qk_fails', n.toString()),
      clearFails: () => { localStorage.removeItem('qk_fails'); localStorage.removeItem('lockTime'); }
    };

    function generateResultCode() {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let p1 = '';
      let p2 = '';
      for (let i = 0; i < 4; i++) p1 += chars.charAt(Math.floor(Math.random() * chars.length));
      for (let i = 0; i < 4; i++) p2 += chars.charAt(Math.floor(Math.random() * chars.length));
      return `RS-${p1}-${p2}`;
    }

    // Native API client interceptor & sync for /api/exam, /api/save, /api/results, /api/check, /api/teacher
    const _originalFetch = window.fetch;
    window.fetch = async function(input, init) {
      try {
        const urlStr = typeof input === 'string' ? input : (input instanceof Request ? input.url : String(input));
        const urlObj = new URL(urlStr, window.location.origin);
        
        // 1. /api/exam
        if (urlObj.pathname === '/api/exam') {
          if (init && init.method === 'POST') {
            let data = {};
            if (init.body) {
              try { data = typeof init.body === 'string' ? JSON.parse(init.body) : init.body; } catch(e){}
            }
            const rand = Math.floor(1000 + Math.random() * 9000);
            const id = (data.id || data.code || `QZ-${rand}`).toUpperCase();
            const questions = data.questions || [];
            const status = data.status || 'draft';
            
            // Map questions to DB format
            const dbQuestions = questions.map((q, idx) => {
              if (q.type === 'blank') {
                return {
                  id: idx + 1,
                  type: 'blank',
                  mode: 'keyword',
                  text: q.text,
                  correctAnswer: q.correctAnswer || '',
                  keywords: [q.correctAnswer || ''],
                  pts: 10,
                  sec: 30
                };
              } else if (q.type === 'writing') {
                return {
                  id: idx + 1,
                  type: 'writing',
                  mode: 'keyword',
                  text: q.text,
                  correctAnswer: q.correctAnswer || '',
                  keywords: [q.correctAnswer || ''],
                  pts: 10,
                  sec: 30
                };
              } else {
                return {
                  id: idx + 1,
                  type: 'mcq',
                  text: q.text,
                  options: q.options || [],
                  opts: q.options || [],
                  correct: typeof q.correct === 'number' ? q.correct : 0,
                  cor: typeof q.correct === 'number' ? q.correct : 0,
                  pts: 10,
                  sec: 30
                };
              }
            });

            const newQuiz = {
              code: id,
              id: id,
              name: data.title || 'تاقیکرن',
              title: data.title || 'تاقیکرن',
              status: status,
              active: (status === 'active'),
              subject: 'گشتی',
              duration: 30,
              teacherId: 'MAM01',
              showScore: true,
              questions: dbQuestions,
              publishedAt: new Date().toISOString()
            };

            const quizzes = DB.getQuizzes();
            const existIdx = quizzes.findIndex(q => q.code === id);
            if (existIdx >= 0) quizzes[existIdx] = newQuiz;
            else quizzes.unshift(newQuiz);
            DB.saveQuizzes(quizzes);

            return new Response(JSON.stringify({ success: true, id, code: id, status, questions }), {
              status: 200,
              headers: { 'Content-Type': 'application/json' }
            });
          }

          // GET /api/exam?code=...
          const code = (urlObj.searchParams.get('code') || '').toUpperCase().trim();
          const role = (urlObj.searchParams.get('role') || '').toLowerCase().trim();
          const quizzes = DB.getQuizzes();
          const quiz = quizzes.find(q => q.code === code);
          if (!quiz) {
            return new Response(JSON.stringify({ error: 'کۆدێ ئەزمونێ نەهاتە دیتن!' }), {
              status: 404,
              headers: { 'Content-Type': 'application/json' }
            });
          }

          const examStatus = quiz.status || (quiz.active ? 'active' : 'draft');
          if (role !== 'teacher' && role !== 'preview' && examStatus !== 'active') {
            return new Response(JSON.stringify({
              error: examStatus === 'closed'
                ? '🔒 ئەڤ تاقیکرنە هاتە داخستن (Status: Closed)'
                : `⚠️ ئەڤ ئەزموونە هێشتا نەهاتیە کاراکرن ژ لایێ مامۆستای ڤە (Status: ${examStatus})! Only active exams can be entered.`,
              status: examStatus,
              notActive: true
            }), {
              status: 403,
              headers: { 'Content-Type': 'application/json' }
            });
          }

          // Format questions compatibility for simple/minimal runners (mcq, blank, writing)
          const formattedQuestions = (quiz.questions || []).map((q, idx) => {
            let type = q.type || 'mcq';
            let options = q.options || q.opts || [];
            let correct = typeof q.correct === 'number' ? q.correct : (typeof q.cor === 'number' ? q.cor : 0);
            let correctAnswer = q.correctAnswer || (q.keywords && q.keywords[0]) || '';

            if (q.type === 'blank') {
              type = 'blank';
              correctAnswer = q.correctAnswer || (q.keywords && q.keywords[0]) || '';
            } else if (q.type === 'writing' || q.type === 'nivisin') {
              type = 'writing';
              correctAnswer = q.correctAnswer || (q.keywords && q.keywords[0]) || '';
            } else if (q.type === 'rast') {
              type = 'mcq';
              options = ['راست', 'خەلەت'];
              correct = q.cor === true ? 0 : 1;
            } else if (q.type === 'chand') {
              type = 'mcq';
              correct = Array.isArray(q.cor) && q.cor.length > 0 ? q.cor[0] : 0;
            } else {
              type = 'mcq';
              options = q.options || q.opts || [];
              correct = typeof q.correct === 'number' ? q.correct : (typeof q.cor === 'number' ? q.cor : 0);
            }

            return {
              id: idx + 1,
              text: q.text || '',
              type: q.type || type,
              options: options,
              correct: correct,
              correctAnswer: correctAnswer,
              model_answer: q.model_answer || correctAnswer,
              keywords: q.keywords || '',
              grading_rubric: q.grading_rubric || '',
              pairs: q.pairs || [],
              unit: q.unit || '',
              tolerance: q.tolerance !== undefined ? q.tolerance : 0.1,
              correctNumber: q.correctNumber !== undefined ? q.correctNumber : 0,
              image: q.image || null,
              pts: q.pts || q.points || 10,
              sec: q.sec || 30
            };
          });

          const resData = {
            id: quiz.code,
            code: quiz.code,
            title: quiz.title || quiz.name || 'تاقیکرن',
            subject: quiz.subject || 'بیرکاری',
            status: examStatus,
            questions: formattedQuestions
          };

          return new Response(JSON.stringify(resData), {
            status: 200,
            headers: { 'Content-Type': 'application/json' }
          });
        }

        // 2. POST /api/save
        if (urlObj.pathname === '/api/save' && init && init.method === 'POST') {
          let body = {};
          if (init.body) {
            try {
              body = typeof init.body === 'string' ? JSON.parse(init.body) : init.body;
            } catch(e) { body = {}; }
          }

          const examCode = (body.exam_id || body.code || body.exam_code_used || '').toUpperCase().trim();
          const studentName = body.name || body.fullName || body.student_name || 'قوتابی';
          const score = body.score || '0';
          const percent = body.percent !== undefined ? body.percent : 0;
          const answers = body.answers || [];

          // Generate RS-XXXX-XXXX
          const resultCode = generateResultCode();

          const record = {
            id: 'res_' + Date.now() + '_' + Math.floor(Math.random()*1000),
            exam_id: examCode,
            exam_code_used: examCode,
            code: examCode,
            student_name: studentName,
            fullName: studentName,
            name: studentName,
            resultCode: resultCode,
            result_code: resultCode,
            answers: answers,
            score: String(score),
            percent: percent,
            time: '30 چرکە',
            cheat: 0,
            published: true,
            date: new Date().toLocaleString('ar-IQ')
          };

          const results = DB.getResults();
          results.unshift(record);
          DB.saveResults(results);

          // Save in submissions
          const rawSubmissions = localStorage.getItem('qk_submissions') || '[]';
          let submissions = JSON.parse(rawSubmissions);
          submissions.unshift(record);
          localStorage.setItem('qk_submissions', JSON.stringify(submissions));

          return new Response(JSON.stringify({
            success: true,
            resultCode: resultCode,
            result_code: resultCode,
            exam_code_used: examCode,
            exam_id: examCode,
            student_name: studentName,
            name: studentName,
            score: score,
            percent: percent,
            id: record.id
          }), {
            status: 200,
            headers: { 'Content-Type': 'application/json' }
          });
        }

        // 3. GET /api/results?code=... OR /api/check?code=...
        if (urlObj.pathname === '/api/results' || urlObj.pathname === '/api/check') {
          const code = (urlObj.searchParams.get('code') || '').toUpperCase().trim();
          
          // QZ- code ONLY for entering exam! Reject when checking results!
          if (code.startsWith('QZ-')) {
            return new Response(JSON.stringify({ 
              error: 'ئەڤ کودە بتنێ بۆ دەستپێکرنا ئەزمونێ یە',
              isExamCode: true
            }), {
              status: 400,
              headers: { 'Content-Type': 'application/json' }
            });
          }

          if (!code.startsWith('RS-')) {
            return new Response(JSON.stringify({ 
              error: 'تکایە کودێ ئەنجامی (RS-XXXX-XXXX) بنڤیسە!' 
            }), {
              status: 400,
              headers: { 'Content-Type': 'application/json' }
            });
          }

          const results = DB.getResults();
          const found = results.find(r => 
            (r.resultCode && r.resultCode.toUpperCase() === code) || 
            (r.result_code && r.result_code.toUpperCase() === code)
          );

          if (found) {
            return new Response(JSON.stringify({
              student_name: found.fullName || found.name || found.student_name,
              name: found.fullName || found.name || found.student_name,
              exam_code_used: found.exam_code_used || found.exam_id || found.code,
              exam_id: found.exam_code_used || found.exam_id || found.code,
              score: typeof found.score === 'string' ? found.score : `${found.score}/${found.total}`,
              percent: found.percent !== undefined ? found.percent : Math.round((found.score/found.total)*100),
              result_code: found.resultCode || found.result_code || code,
              resultCode: found.resultCode || found.result_code || code,
              answers: found.answers || [],
              created_at: found.date || new Date().toLocaleString('ar-IQ')
            }), {
              status: 200,
              headers: { 'Content-Type': 'application/json' }
            });
          }

          return new Response(JSON.stringify({ error: 'ئەنجام ب ڤی کودی نەهاتە دیتن!' }), {
            status: 404,
            headers: { 'Content-Type': 'application/json' }
          });
        }

        // 4. GET /api/teacher
        if (urlObj.pathname === '/api/teacher') {
          const results = DB.getResults();
          return new Response(JSON.stringify(results.map(f => ({
            id: f.id || f.submission_id,
            submission_id: f.id || f.submission_id,
            student_name: f.fullName || f.name,
            name: f.fullName || f.name,
            exam_id: f.exam_id || f.code,
            score: typeof f.score === 'string' ? f.score : `${f.score}/${f.total}`,
            percent: f.percent !== undefined ? f.percent : Math.round((f.score/f.total)*100),
            result_code: f.resultCode || f.result_code || '',
            status: f.status || 'graded',
            hasWrittenQuestions: f.hasWrittenQuestions === true
          }))), { status: 200, headers: { 'Content-Type': 'application/json' } });
        }

        // 5. GET or POST /api/grading
        if (urlObj.pathname === '/api/grading') {
          const rawSubmissions = localStorage.getItem('qk_submissions') || '[]';
          let submissions = JSON.parse(rawSubmissions);

          if (init && init.method === 'POST') {
            let body = {};
            try { body = typeof init.body === 'string' ? JSON.parse(init.body) : init.body; } catch(e) {}
            const { submission_id, resultCode, result_code, answers, teacher_comment, final_score } = body;
            const targetCode = resultCode || result_code;

            const idx = submissions.findIndex(s => 
              (submission_id && s.id === submission_id) || 
              (targetCode && (s.resultCode === targetCode || s.result_code === targetCode))
            );

            if (idx >= 0) {
              if (answers) submissions[idx].answers = answers;
              if (teacher_comment !== undefined) submissions[idx].teacher_comment = teacher_comment;
              if (final_score !== undefined) {
                submissions[idx].final_score = final_score;
                submissions[idx].score = `${final_score}/${submissions[idx].total || 100}`;
                submissions[idx].percent = Math.round((final_score / (submissions[idx].total || 100)) * 100);
              }
              submissions[idx].status = 'graded';
              submissions[idx].graded_at = new Date().toLocaleString('ar-IQ');

              localStorage.setItem('qk_submissions', JSON.stringify(submissions));

              // Sync in results table as well
              const results = DB.getResults();
              const rIdx = results.findIndex(r => 
                (submission_id && r.id === submission_id) || 
                (targetCode && (r.resultCode === targetCode || r.result_code === targetCode))
              );
              if (rIdx >= 0) {
                results[rIdx] = { ...results[rIdx], ...submissions[idx] };
                DB.saveResults(results);
              }

              return new Response(JSON.stringify({ success: true, updated: submissions[idx] }), {
                status: 200,
                headers: { 'Content-Type': 'application/json' }
              });
            }

            return new Response(JSON.stringify({ error: 'بەرسڤا قوتابی نەهاتە دیتن!' }), {
              status: 404,
              headers: { 'Content-Type': 'application/json' }
            });
          }

          // GET /api/grading?exam_id=...
          const examId = (urlObj.searchParams.get('exam_id') || '').toUpperCase().trim();
          let filtered = submissions;
          if (examId) {
            filtered = filtered.filter(s => (s.exam_id || s.code || '').toUpperCase() === examId);
          }
          return new Response(JSON.stringify(filtered), {
            status: 200,
            headers: { 'Content-Type': 'application/json' }
          });
        }

        // 6. POST or GET /api/disputes (grade_disputes table)
        if (urlObj.pathname === '/api/disputes') {
          const rawDisputes = localStorage.getItem('qk_grade_disputes') || '[]';
          let disputes = JSON.parse(rawDisputes);

          if (init && init.method === 'POST') {
            let body = {};
            try { body = typeof init.body === 'string' ? JSON.parse(init.body) : init.body; } catch(e) {}
            const newDispute = {
              id: 'disp_' + Date.now() + '_' + Math.floor(Math.random()*1000),
              submission_id: body.submission_id || body.result_code || '',
              result_code: body.result_code || '',
              student_name: body.student_name || 'قوتابی',
              student_message: body.student_message || body.message || '',
              question_text: body.question_text || '',
              teacher_reply: '',
              status: 'pending',
              created_at: new Date().toLocaleString('ar-IQ')
            };
            disputes.unshift(newDispute);
            localStorage.setItem('qk_grade_disputes', JSON.stringify(disputes));

            return new Response(JSON.stringify({ success: true, dispute: newDispute }), {
              status: 200,
              headers: { 'Content-Type': 'application/json' }
            });
          }

          return new Response(JSON.stringify(disputes), {
            status: 200,
            headers: { 'Content-Type': 'application/json' }
          });
        }
      } catch (err) {
        console.error('Fetch intercept error:', err);
      }
      return _originalFetch.apply(this, arguments);
    };

    function checkAnswer(q, studentAnswer) {
      if (q.type === 'taka' || q.type === 'mcq' || q.type === 'math' || q.type === 'chemical' || q.type === 'diagram') {
        const expected = typeof q.correct === 'number' ? q.correct : (typeof q.cor === 'number' ? q.cor : 0);
        return studentAnswer === expected;
      }
      if (q.type === 'truefalse') {
        const expBool = (q.correct === true || q.correctAnswer === 'true' || q.cor === true);
        return studentAnswer === expBool;
      }
      if (q.type === 'chand') {
        if (!Array.isArray(studentAnswer) || !Array.isArray(q.cor)) return false;
        return JSON.stringify([...studentAnswer].sort()) === JSON.stringify([...q.cor].sort());
      }
      if (q.type === 'rast') return studentAnswer === q.cor;
      if (q.type === 'matching') {
        if (!studentAnswer || typeof studentAnswer !== 'object') return false;
        const pairs = q.pairs || [];
        if (pairs.length === 0) return false;
        return pairs.every(p => {
          const ans = studentAnswer[p.left];
          return ans && String(ans).toLowerCase().trim() === String(p.right).toLowerCase().trim();
        });
      }
      if (q.type === 'numerical') {
        const val = parseFloat(studentAnswer);
        const target = parseFloat(q.correctNumber !== undefined ? q.correctNumber : (q.correctAnswer || 0));
        const tol = parseFloat(q.tolerance !== undefined ? q.tolerance : 0.1);
        return !isNaN(val) && Math.abs(val - target) <= tol;
      }
      if (q.type === 'blank') {
        const text = String(studentAnswer || '').toLowerCase().trim();
        const expected = String(q.correctAnswer || '').toLowerCase().trim();
        if (!text) return false;
        return text.includes(expected) || expected.includes(text) || text === expected;
      }
      if (q.type === 'writing' || q.type === 'nivisin') {
        const res = calculateWrittenScore(
          studentAnswer, 
          q.model_answer || q.correctAnswer || '', 
          q.keywords || '', 
          q.pts || q.points || 10
        );
        return res.isPass;
      }
      return false;
    }

    // FAIR AUTO-GRADING LOGIC for Written Questions
    function calculateWrittenScore(studentAnswer, modelAnswer, keywords, totalPts = 10) {
      const sText = String(studentAnswer || '').trim();
      const mText = String(modelAnswer || '').trim();
      const sLower = sText.toLowerCase();
      const mLower = mText.toLowerCase();

      if (!sText) {
        return {
          suggestedScore: 0,
          explanation: 'بەرسڤ بەتالە (چ پەیڤ نەهاتینە نڤیسین)',
          foundKeywords: [],
          missingKeywords: [],
          isPass: false,
          similarity: 0,
          wordCount: 0
        };
      }

      // Word count check
      const studentWords = sText.split(/\s+/).filter(w => w.length > 0);
      const studentWordCount = studentWords.length;

      // Extract keywords (comma or Arabic comma separated)
      let rawKeywords = [];
      if (Array.isArray(keywords)) {
        rawKeywords = keywords;
      } else if (typeof keywords === 'string') {
        rawKeywords = keywords.split(/[,،]+/).map(k => k.trim()).filter(Boolean);
      }

      // Check keywords existence (case-insensitive, Kurdish/Arabic/Latin support)
      const foundKeywords = [];
      const missingKeywords = [];
      rawKeywords.forEach(k => {
        const kwLower = k.toLowerCase().trim();
        if (kwLower && sLower.includes(kwLower)) {
          foundKeywords.push(k.trim());
        } else if (kwLower) {
          missingKeywords.push(k.trim());
        }
      });

      // Similarity check: percentage of model answer words present in student answer
      const modelWords = mLower.split(/[\s,،.؛;!?؟]+/).filter(w => w.length > 2);
      let matchedModelWords = 0;
      if (modelWords.length > 0) {
        modelWords.forEach(w => {
          if (sLower.includes(w)) matchedModelWords++;
        });
      }
      const similarityPercent = modelWords.length > 0 
        ? Math.round((matchedModelWords / modelWords.length) * 100) 
        : 0;

      // Score calculation
      let score = 0;
      const kwTotal = rawKeywords.length;

      if (kwTotal > 0) {
        // Keyword contribution
        const kwWeight = totalPts * 0.6; // 60% of points for keywords
        const perKw = kwWeight / kwTotal;
        score += foundKeywords.length * perKw;

        // Similarity contribution
        const simWeight = totalPts * 0.4;
        score += (similarityPercent / 100) * simWeight;
      } else {
        // If no keywords defined, rely on similarity and length
        score = (similarityPercent / 100) * totalPts;
      }

      // Length penalty: if answer < 10 words, cap score
      if (studentWordCount < 5) {
        score = Math.min(score, totalPts * 0.3); // Severe penalty for <5 words
      } else if (studentWordCount < 10) {
        score = Math.min(score, totalPts * 0.6); // Penalty for <10 words
      } else if (studentWordCount >= 15 && similarityPercent >= 70) {
        score = Math.max(score, totalPts * 0.85); // High score bonus for thoroughness
      }

      const finalSuggested = Math.max(0, Math.min(totalPts, Math.round(score)));

      // Build Kurdish explanation
      let explanation = '';
      if (kwTotal > 0) {
        explanation = `${foundKeywords.length}/${kwTotal} پەیڤێن سەرەکی هاتنە دیتن: [${foundKeywords.join('، ') || 'چ نینە'}]`;
        if (missingKeywords.length > 0) {
          explanation += ` — پەیڤێن کێم: [${missingKeywords.join('، ')}]`;
        }
      } else {
        explanation = `ڕێژەیا هاوشێوەیی دگەل بەرسڤا نمونەیی: ${similarityPercent}% (${studentWordCount} پەیڤ)`;
      }

      if (studentWordCount < 10) {
        explanation += ` (ئاگەهداری: کێمتر ژ ١٠ پەیڤانە)`;
      }

      return {
        suggestedScore: finalSuggested,
        explanation: explanation,
        foundKeywords,
        missingKeywords,
        similarity: similarityPercent,
        wordCount: studentWordCount,
        isPass: finalSuggested >= (totalPts * 0.5)
      };
    }

      e.preventDefault();
      const quizCode = document.getElementById('search-quiz-code')?.value.trim().toUpperCase() || '';
      const inputFullName = document.getElementById('studentFullName')?.value.trim() || '';

      lastSearchedQuizCode = quizCode;
      lastSearchedFullName = inputFullName;

      const results = DB.getResults().filter(r => r.code === quizCode);
      const cleanedInput = inputFullName.toLowerCase().trim();
      const match = results.find(r => 
        (r.fullName && r.fullName.toLowerCase().trim() === cleanedInput) ||
        (!r.fullName && r.name && r.name.toLowerCase().trim() === cleanedInput) ||
        (r.resultCode && r.resultCode.toLowerCase().trim() === cleanedInput) ||
        (r.studentCode && ('rs-' + r.studentCode).toLowerCase().trim() === cleanedInput)
      );

      if (!match) {
        searchStatus = 'not_found';
        searchedResult = null;
      } else if (!match.published) {
        searchStatus = 'not_published';
        searchedResult = null;
      } else {
        searchStatus = 'found_published';
        searchedResult = match;
      }

      renderRoute();
    }

    function renderSearchResultDetail() {
      if (!searchStatus) return '';

      if (searchStatus === 'not_found') {
        return `
          <div class="p-5 rounded-2xl bg-amber-950/60 border border-gold/40 text-center space-y-2">
            <div class="text-2xl">❌</div>
            <div class="text-sm font-black text-goldBright">
              ناف نەهاتە دیتن - دڵنیابە هەمان نافێ دەمێ تاقیکرنێ بنڤیسی
            </div>
          </div>
        `;
      }

      if (searchStatus === 'not_published') {
        return `
          <div class="p-5 rounded-2xl bg-amber-950/60 border border-gold/40 text-center space-y-2">
            <div class="text-2xl">⏳</div>
            <div class="text-sm font-black text-goldBright">
              ئەنجام هێشتا راگەهاندی نینە
            </div>
            <div class="text-xs text-gray-300 font-semibold">
              ئەو تاقیکرنا تە ئەنجامدای هێشتا ژ لایێ مامۆستای ڤە نەهاتیە راگەهاندن، هیڤیە چاڤەڕێ بە.
            </div>
          </div>
        `;
      }

      if (searchStatus === 'found_published' && searchedResult) {
        const r = searchedResult;
        const quiz = DB.getQuizzes().find(q => q.code === r.code);
        const total = r.total || 100;
        const pct = Math.round((r.score / total) * 100);

        let emoji = '🎉';
        let evaluation = 'زۆر باشە';
        if (pct >= 90) { emoji = '🏆'; evaluation = 'نایاب و سەرفەراز'; }
        else if (pct < 50) { emoji = '📚'; evaluation = 'پێتڤی ب هەولدانێ یە'; }

        let correctCount = 0;
        let wrongCount = 0;
        (r.answers || []).forEach(ans => {
          if (ans.isCorrectCalculated === true) correctCount++;
          else wrongCount++;
        });

        return `
          <div class="p-5 rounded-2xl bg-navyDark/90 border border-gold/40 text-right space-y-4">
            <div class="text-center pb-3 border-b border-white/10">
              <div class="text-3xl mb-1">${emoji}</div>
              <h2 class="text-lg font-black text-white">
                ئەنجامێ تە: <span class="text-goldBright">${r.fullName || r.name}</span>
              </h2>
              <div class="text-[11px] font-mono text-gray-400 mt-0.5">کودێ ئەنجامێ تە: ${r.resultCode || ('RS-' + r.studentCode)}</div>

              <div class="text-4xl font-black text-goldBright mt-2">
                ${r.score} <span class="text-lg font-bold text-gray-400">/ ${total}</span>
              </div>
              <div class="text-xs font-black text-gray-300 mt-1">
                %${pct} ژ سەدێ • ${evaluation}
              </div>
            </div>

            <!-- Questions Breakdown with Red/Green Highlights -->
            <div class="space-y-2.5">
              <h3 class="text-xs font-black text-goldBright uppercase tracking-wider">وردەکاریێن پرسیاران:</h3>
              ${(r.answers || []).map((ans, i) => {
                const q = quiz?.questions[ans.qIndex];
                if (!q) return '';
                const isCorrect = ans.isCorrectCalculated === true;
                const studentAnsText = formatAnswerDisplay(q, ans.answer);
                const correctAnsText = formatCorrectDisplay(q);

                return `
                  <div class="p-3.5 rounded-xl border text-xs space-y-1.5 transition-all ${isCorrect ? 'bg-emerald-950/40 border-emerald-500/60' : 'bg-red-950/40 border-red-500/70'}">
                    <div class="flex items-start justify-between gap-2">
                      <span class="font-bold text-white leading-relaxed">${i+1}. ${q.text}</span>
                      <span class="font-black px-2 py-0.5 rounded-full text-[10px] shrink-0 ${isCorrect ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/40' : 'bg-red-500/20 text-red-300 border border-red-500/40'}">
                        ${isCorrect ? `+${ans.pts} نمرە ✅` : '٠ نمرە ❌'}
                      </span>
                    </div>

                    <div class="pt-1 text-[11px] space-y-1">
                      <div class="${isCorrect ? 'text-emerald-300' : 'text-red-300 font-bold'}">
                        <span>بەرسڤا تە: </span>
                        <span>${studentAnsText}</span>
                        <span>${isCorrect ? '✅' : '❌'}</span>
                      </div>
                      ${!isCorrect ? `
                        <div class="text-emerald-300 font-bold">
                          <span>بەرسڤا دروست: </span>
                          <span>${correctAnsText}</span>
                          <span>✅</span>
                        </div>
                      ` : ''}
                    </div>
                  </div>
                `;
              }).join('')}
            </div>

            <div class="p-3 rounded-xl bg-navy/80 border border-gold/30 text-center font-black text-xs text-white">
              پرسیارێن خەلەت: <span class="text-red-400 font-mono">${wrongCount}</span> • درست: <span class="text-emerald-400 font-mono">${correctCount}</span>
            </div>
          </div>
        `;
      }
    }

    function formatAnswerDisplay(q, ans) {
      if (ans === null || ans === undefined) return 'چ نەهاتیە بەرسڤدان';
      if (q.type === 'taka') return q.opts[ans] || `هەلبژارتنا ${ans + 1}`;
      if (q.type === 'chand') {
        if (!Array.isArray(ans)) return String(ans);
        return ans.map(idx => q.opts[idx] || `هەلبژارتنا ${idx + 1}`).join('، ');
      }
      if (q.type === 'rast') return ans === true ? 'راست' : 'خەلەت';
      return String(ans);
    }

    function formatCorrectDisplay(q) {
      if (q.type === 'taka') return q.opts[q.cor] || `هەلبژارتنا ${q.cor + 1}`;
      if (q.type === 'chand') {
        if (!Array.isArray(q.cor)) return '';
        return q.cor.map(idx => q.opts[idx] || `هەلبژارتنا ${idx + 1}`).join('، ');
      }
      if (q.type === 'rast') return q.cor === true ? 'راست' : 'خەلەت';
      if (q.type === 'nivisin') {
        if (q.mode === 'keyword') return (q.keywords || []).join('، ');
        return 'ب هەڵسەنگاندنا مامۆستای';
      }
      return '';
    }

    // ==========================================
    // 3. QUIZ PLAYER - SILENT EXAM MODE
    // ==========================================
    function renderQuizPlayer(code, fullName) {
      const quiz = DB.getQuizzes().find(q => q.code === code);
      if (!quiz) {
        return `
          ${renderNav()}
          <div class="glass-card text-center py-12">
            <h2 class="text-lg font-black text-white">تاقیکرن نەهاتە دیتن</h2>
            <a href="#/" class="btn-gold-gradient inline-block text-xs py-2 px-4 mt-3">زڤڕین</a>
          </div>
        `;
      }

      const quizStatus = quiz.status || (quiz.active ? 'active' : 'draft');
      if (quizStatus !== 'active') {
        return `
          ${renderNav()}
          <div class="glass-card p-6 text-center space-y-4">
            <div class="w-14 h-14 rounded-full bg-amber-500/15 text-amber-400 border border-amber-500/30 text-2xl mx-auto flex items-center justify-center">
              ⚠️
            </div>
            <div class="text-xs sm:text-sm font-black text-white leading-relaxed p-3.5 bg-amber-950/20 rounded-xl border border-amber-500/20">
              ${quizStatus === 'closed'
                ? `🔒 ئەڤ تاقیکرنە هاتیە داخستن (Closed)`
                : `⚠️ ئەڤ ئەزموونە نەیا کارایە (Status: ${quizStatus})! تەنها دەمێ مامۆستا ئەزموونێ چالاک (Active) دکەت قوتابی دشێن دەستپێبکەن.`}
            </div>
            <a href="#/" class="btn-gold-gradient inline-block text-xs py-2.5 px-6 mt-2">زڤڕین بۆ لاپەرێ سەرەکی</a>
          </div>
        `;
      }

      const isClosed = quiz.isClosed || (quiz.closeAt && new Date() > new Date(quiz.closeAt));
      if (isClosed) {
        const rawCloseAt = quiz.closeAt || 'دیارنەکری';
        const formattedDate = rawCloseAt.replace('T', ' ');
        return `
          ${renderNav()}
          <div class="glass-card p-5 text-center space-y-4">
            <div class="w-14 h-14 rounded-full bg-red-500/15 text-red-400 border border-red-500/30 text-2xl mx-auto flex items-center justify-center">
              🔒
            </div>
            <div class="text-xs sm:text-sm font-black text-white leading-relaxed p-3.5 bg-red-950/20 rounded-xl border border-red-500/20">
              🔒 ئەڤ تاقیکرنە هاتە داخستن - دیماهیکا وێ <span class="font-mono text-goldBright">${quiz.code}</span> ل <span class="font-mono text-goldBright">${formattedDate}</span> بوو - پەیوەندی ب مامۆستا بکە
            </div>
            <a href="#/" class="btn-gold-gradient inline-block text-xs py-2.5 px-6 mt-2">زڤڕین بۆ لاپەرێ سەرەکی</a>
          </div>
        `;
      }

      if (!activeQuiz || activeQuiz.code !== code || activeQuiz.fullName !== fullName) {
        const genResultCode = generateResultCode();
        activeQuiz = {
          code,
          fullName,
          studentCode: genResultCode.replace('RS-', ''),
          resultCode: genResultCode,
          quiz,
          idx: 0,
          cheats: 0,
          startTime: Date.now(),
          studentAnswers: [],
          resultId: 'RES_' + Date.now() + Math.random().toString(36).substring(2, 5)
        };
        selectedCheckboxes = [];
        setupAntiCheat();
        startTimer();
      }

      if (activeQuiz.finished) {
        return renderExamSubmittedScreen(activeQuiz);
      }

      const q = quiz.questions[activeQuiz.idx];
      const percent = Math.round(((activeQuiz.idx) / quiz.questions.length) * 100);

      return `
        <div class="flex items-center justify-between mb-2">
          <div>
            <div class="text-xs font-bold text-gray-400">قوتابی: <strong class="text-goldBright">${activeQuiz.fullName}</strong></div>
            <div class="text-[10px] text-gray-400 font-mono">${quiz.title} • کۆد: ${activeQuiz.resultCode}</div>
          </div>
          <span class="px-2.5 py-0.5 rounded-full bg-goldBright text-navy text-[11px] font-black shadow-md">
            پرسیارا ${activeQuiz.idx + 1} ژ ${quiz.questions.length}
          </span>
        </div>

        <div class="w-full h-2 bg-navyLight rounded-full mb-2.5 overflow-hidden border border-gold/20">
          <div id="progress-bar" class="h-full bg-gradient-to-r from-gold to-goldBright rounded-full transition-all duration-300" style="width: ${percent}%;"></div>
        </div>

        <div class="flex items-center justify-between mb-2 text-xs font-bold">
          <span class="px-2 py-0.5 rounded-full ${activeQuiz.cheats > 0 ? 'bg-red-900/60 text-red-200 border border-red-500' : 'bg-navyLight text-gold border border-gold/20'} text-[10px]">
            🛡️ چاڤدێری: ${activeQuiz.cheats} دەرکەفتن
          </span>
          <span class="text-goldBright font-black text-xs">${q.pts || 10} نمرە</span>
        </div>

        <!-- If question has diagram image, show it prominently -->
        ${q.image ? `
          <div class="glass-card p-2.5 mb-3 text-center space-y-2">
            <img src="${q.image}" alt="Diagram" class="max-h-56 mx-auto rounded-xl object-contain shadow-lg border border-white/10">
            <div class="pt-1 border-t border-white/10 flex items-center justify-between text-xs text-gray-300">
              <span class="text-[11px] text-goldBright font-bold">⚡ دیاگرامێ زانستی</span>
              <button type="button" onclick="toggleStudentScratchpad()" class="px-2.5 py-1 rounded-lg bg-navyLight border border-gold/30 text-goldBright hover:text-white text-[11px] font-bold">
                🎨 تابلۆیێ وێنەکێشانێ (Scratchpad Canvas)
              </button>
            </div>
            <div id="student-scratchpad-wrap" class="hidden pt-2 border-t border-white/10 text-right space-y-1.5">
              <div class="flex items-center justify-between text-[11px]">
                <span class="text-gray-400">تابلۆیێ وێنەکێشان و شیکاریا دیاگرامێ:</span>
                <button type="button" onclick="clearStudentCanvas()" class="text-red-400 hover:underline">سڕینەوە 🗑️</button>
              </div>
              <canvas id="student-scratch-canvas" width="450" height="180" class="w-full bg-navyDark rounded-xl border border-white/10 touch-none cursor-crosshair"></canvas>
            </div>
          </div>
        ` : ''}

        <!-- Question Box + Compact Timer Grid Side-by-Side to eliminate 80% empty space -->
        <div class="grid grid-cols-4 gap-2 mb-3">
          <div class="col-span-3 glass-card p-3 flex items-center border-r-4 border-r-goldBright">
            <h2 class="text-xs sm:text-sm font-black text-white leading-relaxed formula-renderable">${q.text}</h2>
          </div>
          <div class="col-span-1 glass-card p-2 flex flex-col items-center justify-center text-center">
            <div class="text-xl font-black text-goldBright animate-pulse" id="time-display">${activeQuiz.timeLeft || q.sec || 30}</div>
            <div class="text-[8px] font-bold text-gray-400 uppercase">چرکە</div>
          </div>
        </div>

        <div id="opts-box" class="space-y-2">${renderStudentExamOptions(q)}</div>
      `;
    }

    function renderStudentExamOptions(q) {
      if (q.type === 'taka' || q.type === 'mcq' || q.type === 'math' || q.type === 'chemical' || q.type === 'diagram') {
        const letters = ['أ', 'ب', 'ج', 'د'];
        const options = q.options || q.opts || [];
        return `
          <div class="space-y-2">
            ${options.map((opt, i) => `
              <button onclick="handleExamTaka(${i})" class="w-full flex items-center p-3.5 bg-navyLight/70 hover:bg-navyLight rounded-xl border border-gold/20 hover:border-goldBright active:scale-98 font-bold text-xs sm:text-sm text-white transition-all shadow-md">
                <span class="w-6 h-6 rounded-lg bg-goldBright text-navy font-black text-xs flex items-center justify-center ml-2.5 shrink-0">${letters[i] || (i+1)}</span>
                <span class="formula-renderable">${opt}</span>
              </button>
            `).join('')}
          </div>
        `;
      }
      if (q.type === 'truefalse') {
        return `
          <div class="grid grid-cols-2 gap-3 py-1">
            <button onclick="handleExamTrueFalse(true)" class="py-4 rounded-xl border-2 border-emerald-500/50 hover:border-emerald-400 bg-emerald-950/30 hover:bg-emerald-950/60 font-black text-emerald-300 text-sm sm:text-base flex items-center justify-center gap-2 shadow-lg transition-all active:scale-95">
              <span>دگ (True)</span>
              <span>✅</span>
            </button>
            <button onclick="handleExamTrueFalse(false)" class="py-4 rounded-xl border-2 border-rose-500/50 hover:border-rose-400 bg-rose-950/30 hover:bg-rose-950/60 font-black text-rose-300 text-sm sm:text-base flex items-center justify-center gap-2 shadow-lg transition-all active:scale-95">
              <span>نەدگ (False)</span>
              <span>❌</span>
            </button>
          </div>
        `;
      }
      if (q.type === 'matching') {
        const pairs = q.pairs || [];
        const rightOpts = [...pairs.map(p => p.right)].sort(() => Math.random() - 0.5);
        return `
          <form onsubmit="submitExamMatching(event)" class="space-y-3">
            <div class="p-2 bg-navyLight/40 rounded-xl border border-gold/20 text-xs text-goldBright font-bold">
              بۆ هەر بڕگەیەکێ ل ستوونا A، بەرسڤا دروست ژ ستوونا B هەڵبژێرە:
            </div>
            <div class="space-y-2">
              ${pairs.map((p, idx) => `
                <div class="p-3 bg-navyLight/70 rounded-xl border border-gold/20 flex flex-col sm:flex-row sm:items-center justify-between gap-2 text-xs">
                  <div class="font-bold text-white">
                    <span class="text-goldBright ml-1.5">${idx + 1}.</span>
                    <span class="formula-renderable">${p.left}</span>
                  </div>
                  <select 
                    id="student_match_${idx}"
                    data-left="${p.left.replace(/"/g, '&quot;')}"
                    required
                    class="h-9 px-2.5 bg-navyDark border border-gold/40 rounded-lg text-xs text-emerald-300 font-bold focus:outline-none focus:border-goldBright"
                  >
                    <option value="">-- هەڵبژێرە --</option>
                    ${rightOpts.map(ro => `<option value="${ro.replace(/"/g, '&quot;')}">${ro}</option>`).join('')}
                  </select>
                </div>
              `).join('')}
            </div>
            <button type="submit" class="btn-gold-gradient w-full py-2.5 text-xs font-black">پشتڕاستکرنا هەڤبەرکرنێ ✓</button>
          </form>
        `;
      }
      if (q.type === 'numerical') {
        return `
          <form onsubmit="submitExamNumerical(event)" class="space-y-3">
            <div class="p-2 bg-navyLight/40 rounded-xl border border-gold/20 text-xs text-goldBright font-bold">
              ئەنجامێ ژمارەیی یێ ڤەکۆلینێ بنڤیسە:
            </div>
            <div class="flex items-center gap-2">
              <input 
                id="student-numerical" 
                type="number" 
                step="any" 
                required 
                class="qk-input-2026 font-mono text-center text-sm sm:text-base font-black flex-1 !p-3" 
                placeholder="ژمارەیێ ل ڤێرێ بنڤیسە..." 
                autocomplete="off" 
              />
              ${q.unit ? `<span class="h-11 px-3.5 bg-navyLight border border-gold/40 text-goldBright font-black text-xs sm:text-sm rounded-xl flex items-center justify-center">${q.unit}</span>` : ''}
            </div>
            <button type="submit" class="btn-gold-gradient w-full py-2.5 text-xs font-black">تۆمارکرن و چوونا پرسیارا داهاتی ↵</button>
          </form>
        `;
      }
      if (q.type === 'chand') {
        const letters = ['أ', 'ب', 'ج', 'د'];
        const options = q.options || q.opts || [];
        return `
          <div class="space-y-2">
            ${options.map((opt, i) => {
              const sel = selectedCheckboxes.includes(i);
              return `
                <div onclick="toggleExamCheck(${i})" class="w-full flex items-center p-3 rounded-xl border ${sel ? 'border-goldBright bg-navyLight' : 'border-gold/20 bg-navyLight/60'} cursor-pointer font-bold text-xs text-white select-none transition-all">
                  <span class="w-6 h-6 rounded-lg ${sel ? 'bg-goldBright text-navy' : 'bg-navyDark text-gray-300'} font-black text-xs flex items-center justify-center ml-2.5 shrink-0">
                    ${sel ? '✓' : letters[i]}
                  </span>
                  <span class="formula-renderable">${opt}</span>
                </div>
              `;
            }).join('')}
            <button onclick="submitExamChand()" class="btn-gold-gradient w-full py-2.5 text-xs font-black mt-1">پشتڕاستکرنا بەرسڤێ ✓</button>
          </div>
        `;
      }
      if (q.type === 'rast') {
        return `
          <div class="grid grid-cols-2 gap-2.5">
            <button onclick="handleExamRast(true)" class="py-4 rounded-xl border border-gold/20 hover:border-emerald-400 bg-navyLight/70 font-black text-emerald-300 text-base flex items-center justify-center gap-1.5">
              <span>راست</span><span>✓</span>
            </button>
            <button onclick="handleExamRast(false)" class="py-4 rounded-xl border border-gold/20 hover:border-red-400 bg-navyLight/70 font-black text-red-300 text-base flex items-center justify-center gap-1.5">
              <span>خەلەت</span><span>✗</span>
            </button>
          </div>
        `;
      }
      if (q.type === 'blank') {
        const displaySentence = (q.text || '').replace('___', '<span class="text-goldBright font-bold px-2 py-0.5 bg-goldBright/10 rounded border border-goldBright/30">________</span>');
        return `
          <form onsubmit="submitExamNivisin(event)" class="space-y-2">
            <p class="text-xs sm:text-sm text-slate-200 font-bold mb-1 formula-renderable leading-relaxed">${displaySentence}</p>
            <input id="student-nivisin" type="text" class="qk-input-2026 font-semibold text-xs !p-3" placeholder="بۆشایی پر بکە..." required autocomplete="off" />
            <button type="submit" class="btn-gold-gradient w-full py-2.5 text-xs font-black">تۆمارکرن و چوونا پرسیارا داهاتی ↵</button>
          </form>
        `;
      }
      if (q.type === 'nivisin' || q.type === 'writing') {
        const rubricHint = q.grading_rubric ? `<div class="p-2.5 rounded-xl bg-navyDark/80 border border-gold/30 text-[11px] text-goldBright"><span>📌 ڕێنمایا مامۆستای:</span> ${q.grading_rubric}</div>` : '';
        const ptsBadge = `<span class="px-2 py-0.5 rounded-full bg-gold/15 border border-gold/40 text-goldBright font-mono text-[11px] font-black">${q.pts || q.points || 10} نمرە</span>`;
        return `
          <form onsubmit="submitExamNivisin(event)" class="space-y-3">
            <div class="flex items-center justify-between">
              <span class="text-xs text-slate-300 font-bold">✍️ بەرسڤا نڤیسینێ بەرفرەهـ بکە:</span>
              ${ptsBadge}
            </div>
            ${rubricHint}
            <div class="relative">
              <textarea 
                id="student-nivisin" 
                rows="6" 
                oninput="updateStudentWordCount(this.value)"

    function startTimer() {
      if (quizTimer) clearInterval(quizTimer);
      if (!activeQuiz || activeQuiz.finished) return;

      const q = activeQuiz.quiz.questions[activeQuiz.idx];
      activeQuiz.timeLeft = q.sec || 30;

      quizTimer = setInterval(() => {
        if (!activeQuiz || activeQuiz.finished) { clearInterval(quizTimer); return; }
        activeQuiz.timeLeft--;
        const el = document.getElementById('time-display');
        if (el) el.textContent = activeQuiz.timeLeft;

        if (activeQuiz.timeLeft <= 0) {
          clearInterval(quizTimer);
          showToast('دەمێ پرسیارێ ب دووماهی هات!');
          recordAndAdvance(null);
        }
      }, 1000);
    }

    function handleExamTaka(chosenIdx) {
      clearInterval(quizTimer);
      recordAndAdvance(chosenIdx);
    }

    function toggleExamCheck(idx) {
      if (selectedCheckboxes.includes(idx)) {
        selectedCheckboxes = selectedCheckboxes.filter(i => i !== idx);
      } else {
        selectedCheckboxes.push(idx);
        selectedCheckboxes.sort();
      }
      const q = activeQuiz.quiz.questions[activeQuiz.idx];
      const box = document.getElementById('opts-box');
      if (box) box.innerHTML = renderStudentExamOptions(q);
    }

    function submitExamChand() {
      clearInterval(quizTimer);
      const chosen = [...selectedCheckboxes];
      selectedCheckboxes = [];
      recordAndAdvance(chosen);
    }

    function handleExamTrueFalse(val) {
      clearInterval(quizTimer);
      recordAndAdvance(val);
    }

    function submitExamMatching(e) {
      if (e) e.preventDefault();
      clearInterval(quizTimer);
      const q = activeQuiz.quiz.questions[activeQuiz.idx];
      const pairs = q.pairs || [];
      const studentMap = {};
      pairs.forEach((p, idx) => {
        const sel = document.getElementById(`student_match_${idx}`);
        if (sel) {
          studentMap[p.left] = sel.value;
        }
      });
      recordAndAdvance(studentMap);
    }

    function submitExamNumerical(e) {
      if (e) e.preventDefault();
      clearInterval(quizTimer);
      const val = document.getElementById('student-numerical')?.value || '';
      recordAndAdvance(val);
    }

    function submitExamNivisin(e) {
      if (e) e.preventDefault();
      clearInterval(quizTimer);
      const text = document.getElementById('student-nivisin')?.value || '';
      recordAndAdvance(text);
    }

    function recordAndAdvance(answerVal) {
      const q = activeQuiz.quiz.questions[activeQuiz.idx];
      const isCorrectCalculated = checkAnswer(q, answerVal);
      const pts = (isCorrectCalculated === true) ? (q.pts || 10) : 0;

      activeQuiz.studentAnswers.push({
        qIndex: activeQuiz.idx,
        answer: answerVal,
        isCorrectCalculated,
        pts
      });

      activeQuiz.idx++;
      if (activeQuiz.idx >= activeQuiz.quiz.questions.length) {
        finishExamQuiz();
      } else {
        renderRoute();
        startTimer();
      }
    }

    function finishExamQuiz() {
      if (quizTimer) clearInterval(quizTimer);
      activeQuiz.finished = true;

      const totalPts = activeQuiz.quiz.questions.reduce((a, b) => a + (b.pts || 10), 0);
      const autoScore = activeQuiz.studentAnswers.reduce((sum, a) => sum + (a.pts || 0), 0);
      const sec = Math.max(1, Math.round((Date.now() - activeQuiz.startTime) / 1000));
      const percent = Math.round((autoScore / totalPts) * 100);

      // Format answers for detailed review on /results & /teacher/grading
      let hasWrittenQuestions = false;
      const formattedAnswers = (activeQuiz.studentAnswers || []).map((a, i) => {
        const q = activeQuiz.quiz.questions[a.qIndex !== undefined ? a.qIndex : i] || {};
        let expected = q.model_answer || q.correctAnswer || '';
        if (q.type === 'mcq' || q.type === 'taka') {
          const opts = q.options || q.opts || [];
          expected = opts[q.correct !== undefined ? q.correct : q.cor] || '';
        }

        const isWritten = (q.type === 'writing' || q.type === 'nivisin');
        if (isWritten) hasWrittenQuestions = true;

        let writtenAnalysis = null;
        if (isWritten) {
          writtenAnalysis = calculateWrittenScore(
            a.answer, 
            q.model_answer || q.correctAnswer || '', 
            q.keywords || '', 
            q.pts || q.points || 10
          );
        }

        const autoItemScore = isWritten 
          ? (writtenAnalysis ? writtenAnalysis.suggestedScore : 0)
          : (a.isCorrectCalculated === true ? (q.pts || 10) : 0);

        return {
          question: q.text || `پرسیارا ${i + 1}`,
          type: q.type || 'mcq',
          userAns: typeof a.answer === 'object' ? JSON.stringify(a.answer) : String(a.answer || '—'),
          expected: expected,
          model_answer: q.model_answer || expected,
          keywords: q.keywords || '',
          grading_rubric: q.grading_rubric || '',
          isCorrect: a.isCorrectCalculated === true,
          pts: q.pts || q.points || 10,
          auto_score: autoItemScore,
          suggestedScore: autoItemScore,
          explanation: writtenAnalysis ? writtenAnalysis.explanation : '',
          foundKeywords: writtenAnalysis ? writtenAnalysis.foundKeywords : [],
          missingKeywords: writtenAnalysis ? writtenAnalysis.missingKeywords : [],
          similarity: writtenAnalysis ? writtenAnalysis.similarity : 0,
          wordCount: writtenAnalysis ? writtenAnalysis.wordCount : 0,
          teacher_comment: '',
          final_score: autoItemScore,
          isWritten: isWritten
        };
      });

      const totalAutoScore = formattedAnswers.reduce((sum, a) => sum + (a.auto_score !== undefined ? a.auto_score : (a.pts || 0)), 0);
      const computedPercent = Math.round((totalAutoScore / totalPts) * 100);

      const record = {
        id: activeQuiz.resultId,
        submission_id: activeQuiz.resultId,
        code: activeQuiz.code,
        exam_id: activeQuiz.code,
        exam_code_used: activeQuiz.code,
        fullName: activeQuiz.fullName,
        student_name: activeQuiz.fullName,
        name: activeQuiz.fullName,
        resultCode: activeQuiz.resultCode,
        result_code: activeQuiz.resultCode,
        answers: formattedAnswers,
        auto_score: totalAutoScore,
        final_score: totalAutoScore,
        score: `${totalAutoScore}/${totalPts}`,
        total: totalPts,
        percent: computedPercent,
        hasWrittenQuestions: hasWrittenQuestions,
        status: hasWrittenQuestions ? 'pending_teacher_review' : 'graded',
        teacher_comment: '',
        student_question: '',
        time: `${sec} چرکە`,
        cheat: activeQuiz.cheats,
        published: true,
        date: new Date().toLocaleString('ar-IQ'),
        created_at: new Date().toLocaleString('ar-IQ')
      };

      const results = DB.getResults();
      results.unshift(record);
      DB.saveResults(results);

      // Save to submissions
      const rawSubmissions = localStorage.getItem('qk_submissions') || '[]';
      let submissions = JSON.parse(rawSubmissions);
      submissions.unshift(record);
      localStorage.setItem('qk_submissions', JSON.stringify(submissions));

      // POST to /api/save
      fetch('/api/save', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(record)
      }).catch(() => {});

      renderRoute();
    }

    function handleTeacherRegister(e) {
      e.preventDefault();
      const name = document.getElementById('reg-name').value.trim();
      const father = document.getElementById('reg-father').value.trim();
      const subject = document.getElementById('reg-subject').value.trim();
      const invite = document.getElementById('reg-invite').value.trim();
      const pass = document.getElementById('reg-password').value.trim();

      const inviteLower = invite.toLowerCase();
      if (inviteLower !== MASTER_CODE.toLowerCase() && inviteLower !== 'mamosta' && inviteLower !== '#mamosta') {
        showToast('کودێ نهێنی خەلەتە - ئەو تنێ ل دەف مامۆستایانە');
        return;
      }

      if (pass.length < 6) {
        showToast('پەیڤا نهێنی پێتڤیە ل ٦ پیتان کێمتر نەبیت');
        return;
      }

      const teachers = DB.getTeachers();
      if (teachers.some(t => t.user && t.user.toLowerCase() === name.toLowerCase())) {
        showToast('ئەڤ ناڤە یێ تۆمارکریە! ناڤەکێ دی هەلبژێرە.');
        return;
      }

      const fullName = `${name} ${father}`;
      const newTeacher = {
        id: 'MAM_' + Date.now().toString().slice(-4),
        user: name,
        name: fullName,
        fullName: fullName,
        pass: pass,
        subject: subject
      };

      teachers.push(newTeacher);
      DB.saveTeachers(teachers);
      DB.clearFails();
      
      // Notify registration was successful, set green notice text, and switch to Login tab
      registrationSuccessMsg = `تۆمارکرن ب سەرکەفتی هاتە ئەنجامدان! نها ناڤێ خۆ (${name}) یان ناڤێ سێیانی ل دەک پاودێ بنڤیسە بۆ چوونا ژوور ل بەشێ چوونا ژوورێ.`;
      showToast('هەژمارا تە ب سەرکەفتی هاتیە تۆمارکرن 👨‍🏫');
      currentTeacherTab = 'login';
      renderRoute();
    }

    function handleTeacherLogin(e) {
      e.preventDefault();
      const userVal = document.getElementById('login-username').value.trim();
      const passVal = document.getElementById('login-password').value.trim();

      const lockUntil = DB.getLockTime();
      if (lockUntil && lockUntil > Date.now()) {
        showToast('٣ جارا خەلەت - ٥ خولەکا داهێ قفلە');
        return;
      }

      const teachers = DB.getTeachers();
      const teacher = teachers.find(t => 
        (t.user && t.user.toLowerCase() === userVal.toLowerCase()) ||
        (t.fullName && t.fullName.toLowerCase() === userVal.toLowerCase()) ||
        (t.name && t.name.toLowerCase() === userVal.toLowerCase())
      );

      if (!teacher) {
        showToast('ئەڤ مامۆستایە نەهاتیە تۆمارکرن!');
        return;
      }

      if (teacher.pass !== passVal) {
        const fails = DB.getFails() + 1;
        DB.setFails(fails);
        if (fails >= 3) {
          DB.setLockTime(Date.now() + LOCK_MINUTES * 60 * 1000);
          showToast('٣ جارا خەلەت - ٥ خولەکا داهێ قفلە');
          renderRoute();
        } else {
          showToast(`پەیڤا نهێنی یا خەلەتە! مانا سەربوردان: ${3 - fails}`);
        }
        return;
      }

      DB.clearFails();
      registrationSuccessMsg = ''; // Reset registration notice on login
      showToast('ب خێرهاتیەڤە مامۆستا ' + (teacher.fullName || teacher.name));
      DB.setCurrTeacher(teacher);
      currentDashboardView = 'my_quizzes';
      renderRoute();
    }

          </div>

          ${renderTypeSpecificBuilder(q, idx)}
        </div>
      `;
    }

    function updateQType(idx, type) {
      if (type === 'taka') builderDraft[idx] = { type, text: builderDraft[idx].text, opts: ['', '', '', ''], cor: 0, pts: 10, sec: 30 };
      else if (type === 'chand') builderDraft[idx] = { type, text: builderDraft[idx].text, opts: ['', '', '', ''], cor: [0], pts: 10, sec: 30 };
      else if (type === 'rast') builderDraft[idx] = { type, text: builderDraft[idx].text, cor: true, pts: 10, sec: 20 };
      else if (type === 'nivisin') builderDraft[idx] = { type, mode: 'keyword', text: builderDraft[idx].text, keywords: ['کوردستان'], required: 1, pts: 15, sec: 60 };
      renderRoute();
    }

              </div>
            `).join('')}
          </div>
        `;
      }
      if (q.type === 'chand') {
        const cors = q.cor || [];
        return `
          <div class="space-y-1.5">
            <div class="text-[11px] text-gray-400 font-bold">چەند هەلبژارتن (بەرسڤێن دروست تیک بکە):</div>
            ${[0, 1, 2, 3].map(i => `
              <div class="flex items-center gap-2">
                <input type="checkbox" ${cors.includes(i) ? 'checked' : ''} onchange="toggleBuilderCheck(${idx}, ${i})" />
                <input type="text" value="${q.opts[i] || ''}" oninput="builderDraft[${idx}].opts[${i}] = this.value" placeholder="هەلبژارتنا ${i+1}" class="qk-input-2026 !p-2 text-xs flex-1" />
              </div>
            `).join('')}
          </div>
        `;
      }
      if (q.type === 'rast') {
        return `
          <div class="flex items-center gap-4 text-xs font-black">
            <span>بەرسڤا دروست:</span>
            <label class="flex items-center gap-1 cursor-pointer">
              <input type="radio" name="rast_${idx}" ${q.cor === true ? 'checked' : ''} onchange="builderDraft[${idx}].cor = true" />
              <span class="text-emerald-400">راست ✓</span>
            </label>
            <label class="flex items-center gap-1 cursor-pointer">
              <input type="radio" name="rast_${idx}" ${q.cor === false ? 'checked' : ''} onchange="builderDraft[${idx}].cor = false" />
              <span class="text-red-400">خەلەت ✗</span>
            </label>
          </div>
        `;
      }
      if (q.type === 'nivisin') {
        return `
          <div class="bg-navy p-3 rounded-xl border border-white/10 text-xs space-y-2">
            <div class="font-bold text-goldBright">شێوازێ نمرەدانێ:</div>
            <div class="flex gap-4">
              <label class="flex items-center gap-1.5 cursor-pointer">
                <input type="radio" name="mode_${idx}" ${q.mode === 'keyword' ? 'checked' : ''} onchange="builderDraft[${idx}].mode = 'keyword'; renderRoute();" />
                <span>ب پەیڤێن کلیلی (ئۆتۆماتیک)</span>
              </label>
              <label class="flex items-center gap-1.5 cursor-pointer">
                <input type="radio" name="mode_${idx}" ${q.mode === 'manual' ? 'checked' : ''} onchange="builderDraft[${idx}].mode = 'manual'; renderRoute();" />
                <span>ب دەستی</span>
              </label>
            </div>
            ${q.mode === 'keyword' ? `
              <div class="pt-1 space-y-1.5">
                <input type="text" value="${(q.keywords || []).join(', ')}" oninput="builderDraft[${idx}].keywords = this.value.split(',').map(s=>s.trim()).filter(Boolean)" placeholder="پەیڤ: گارە, کوردستان" class="qk-input-2026 !p-2 text-xs" />
                <div class="flex items-center gap-2">
                  <span>چەند پەیڤ دڤێت هەبن؟</span>
                  <input type="number" min="1" value="${q.required || 1}" onchange="builderDraft[${idx}].required = parseInt(this.value)||1" class="w-16 p-1 border rounded bg-navy text-white text-xs text-center" />
                </div>
              </div>
            ` : '<div class="text-[11px] text-gray-400">مامۆستا پشتی نمرێ ددەت.</div>'}
          </div>
        `;
      }
    }

    function toggleBuilderCheck(qIdx, optIdx) {
      let cors = builderDraft[qIdx].cor || [];
      if (cors.includes(optIdx)) cors = cors.filter(x => x !== optIdx);
      else cors.push(optIdx);
      if (cors.length === 0) cors = [optIdx];
      builderDraft[qIdx].cor = cors;
    }

    function saveCreatedQuiz(teacherId) {
      const title = document.getElementById('b-title')?.value.trim();
      if (!title) { showToast('هیڤیە ناڤونیشانێ تاقیکرنێ بنڤیسە'); return; }
      
      const subject = document.getElementById('b-subject')?.value || 'بیرکاری';
      const closeAt = document.getElementById('b-closeAt')?.value || null;

      // Generate a nice random code e.g. QZ-A4D2X
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let randomCode = '';
      for (let i = 0; i < 5; i++) {
        randomCode += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      const code = 'QZ-' + randomCode;

      const newQuiz = { 
        code, 
        teacherId, 
        title, 
        name: title,
        subject,
        questions: JSON.parse(JSON.stringify(builderDraft)),
        date: new Date().toLocaleDateString('ku-IQ'),
        created: new Date().toISOString(),
        closeAt,
        isClosed: false
      };

      const quizzes = DB.getQuizzes();
      quizzes.unshift(newQuiz);
      DB.saveQuizzes(quizzes);

      builderDraft = [];
      createdQuizSuccess = newQuiz;
      showToast('تاقیکرن ب سەرکەفتیانە هاتە دروست کرن: ' + code);
      renderRoute();
    }

    function copyQuizLink(code) {
      const url = window.location.origin + window.location.pathname + '#/quiz/' + code;
      navigator.clipboard.writeText(url).then(() => showToast('لینکا تاقیکرنێ هاتە کۆپیکرن!'));
    }

    function toggleQuizStatus(code) {
      const quizzes = DB.getQuizzes();
      const q = quizzes.find(x => x.code === code);
      if (q) {
        q.isClosed = !q.isClosed;
        DB.saveQuizzes(quizzes);
        showToast(q.isClosed ? 'تاقیکرن هاتە داخستن 🔒' : 'تاقیکرن هاتە ڤەکرن 🔓');
        renderRoute();
      }
    }

    function deleteQuiz(code) {
      if (!confirm('دڵنیای دێ ژێبەی؟ هەمی ئەنجام دێ چن!')) return;
      DB.saveQuizzes(DB.getQuizzes().filter(x => x.code !== code));
      DB.saveResults(DB.getResults().filter(x => x.code !== code));
      showToast('تاقیکرن و ئەنجامێن وێ هاتنە ژێبرن 🗑️');
      renderRoute();
    }

    // Teacher Results View with WhatsApp Copy
    function renderTeacherResultsPage(code) {
      const quiz = DB.getQuizzes().find(q => q.code === code) || { title: 'تاقیکرن', code, questions: [] };
      const allResults = DB.getResults().filter(r => r.code === code);
      const unpub = allResults.filter(r => !r.published);
      const pub = allResults.filter(r => r.published);

      return `
        ${renderNav('home')}
        <div class="glass-card p-6 mb-6">
          <div class="flex items-center justify-between pb-4 border-b border-white/10 flex-wrap gap-2">
            <div>
              <a href="#mamosta-veşarti-2026" class="text-xs font-black text-goldBright hover:underline">← زڤڕین بۆ داشبۆردێ</a>
              <h1 class="text-base font-black text-white mt-1">${quiz.title}</h1>
              <div class="text-xs font-mono text-gray-400">کۆد: ${quiz.code}</div>
            </div>
            <div class="flex items-center gap-1.5 flex-wrap">
              <a href="/teacher/grading" class="btn-gold-gradient text-xs py-2 px-3 shadow-sm flex items-center gap-1 font-black">
                <span>✍️</span><span>داشبۆردا نمرەدانێ (Grading)</span>
              </a>
              <button onclick="copyAllStudentResultCodes('${code}')" class="py-2 px-3 rounded-xl bg-slate-800 text-yellow-300 border border-slate-700 text-xs font-bold" title="کۆپیکرن بۆ واتسئاپێ">
                📋 کۆپیکرنا کودێن ئەنجامان
              </button>
              <button onclick="publishAllResults('${code}')" class="text-xs font-black py-2 px-3 rounded-xl bg-navyDark text-white border border-white/20">
                📢 راگەهاندنا هەمیا
              </button>
            </div>
          </div>

          <div class="flex border-b border-white/10 mt-4 mb-4">
            <button onclick="activeResultTab='unpublished'; renderRoute();" class="py-2 px-3 font-black text-xs border-b-2 ${activeResultTab === 'unpublished' ? 'border-goldBright text-goldBright' : 'border-transparent text-gray-400'}">
              ⏳ چاڤەڕێی نمرەدانێ (${unpub.length})
            </button>
            <button onclick="activeResultTab='published'; renderRoute();" class="py-2 px-3 font-black text-xs border-b-2 ${activeResultTab === 'published' ? 'border-goldBright text-goldBright' : 'border-transparent text-gray-400'}">
              ✅ راگەهاندی (${pub.length})
            </button>
          </div>

          ${renderResultsTable(activeResultTab === 'unpublished' ? unpub : pub, quiz)}
        </div>
      `;
    }

    function renderResultsTable(list, quiz) {
      if (list.length === 0) return '<div class="text-center py-8 text-gray-400 text-xs">چ ئەنجام ل ڤێرێ نینن</div>';

      return `
        <div class="overflow-x-auto border border-white/10 rounded-2xl text-xs">
          <table class="w-full text-right">
            <thead class="bg-navyDark/80 text-goldBright font-black border-b border-white/10">
              <tr>
                <th class="p-3">نافێ قوتابی</th>
                <th class="p-3">کودێ ئەنجامێ</th>
                <th class="p-3">نمرە</th>
                <th class="p-3">کردار</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-white/5">
              ${list.map(r => `
                <tr class="hover:bg-white/5">
                  <td class="p-3 font-bold text-white">${r.fullName || r.name}</td>
                  <td class="p-3 font-mono font-black text-goldBright">${r.resultCode || ('RS-' + r.studentCode)}</td>
                  <td class="p-3 font-black text-white">${r.score} / ${r.total}</td>
                  <td class="p-3">
                    ${!r.published ? `
                      <button onclick="publishSingleResult('${r.id}')" class="px-2.5 py-1 rounded-lg bg-goldBright text-navy font-black text-[11px]">
                        📢 راگەهاندن
                      </button>
                    ` : '<span class="text-emerald-400 font-bold">راگەهاندی ✓</span>'}
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    function copyAllStudentResultCodes(code) {
      const results = DB.getResults().filter(r => r.code === code);
      if (results.length === 0) { showToast('چ قوتابی نینن!'); return; }

      let msg = `📋 کودێن ئەنجامێن تاقیکرنێ (${code}):\n`;
      results.forEach(r => {
        const rc = r.resultCode || ('RS-' + r.studentCode);
        msg += `قوتابی ${r.fullName || r.name}: کودێ ئەنجام ${rc}\n`;
      });

      navigator.clipboard.writeText(msg).then(() => {
        showToast('کودێن ئەنجامان هاتینە کۆپیکرن بۆ واتسئاپێ!');
      });
    }

    function publishSingleResult(resultId) {
      const results = DB.getResults();
      const r = results.find(x => x.id === resultId);
      if (r) {
        r.published = true;
        DB.saveResults(results);
        showToast('ئەنجام هاتە راگەهاندن!');
        renderRoute();
      }
    }

    function publishAllResults(code) {
      const results = DB.getResults();
      results.forEach(r => { if (r.code === code) r.published = true; });
      DB.saveResults(results);
      showToast('هەمی ئەنجام هاتینە راگەهاندن!');
      activeResultTab = 'published';
      renderRoute();
    }

    function exportAllResultsToCSV() {
      const results = DB.getResults();
      if (results.length === 0) {
        showToast('چ ئەنجام د بەردەست نینن بۆ ناردنێ!');
        return;
      }

      const quizzes = DB.getQuizzes();
      const headers = ['ناڤێ تاقیکرنێ', 'کۆدا تاقیکرنێ', 'ناڤێ قوتابی یێ سیانی', 'کۆدا ئەنجامی', 'نمرە', 'نمرەیا گشتی', 'دەمی', 'چاڤدێری (دەرکەفتن)', 'بەروار'];
      
      let csvContent = '\uFEFF'; // UTF-8 BOM for Excel Kurdish rendering
      csvContent += headers.map(h => `"${h.replace(/"/g, '""')}"`).join(',') + '\n';

      results.forEach(r => {
        const quiz = quizzes.find(q => q.code === r.code) || {};
        const quizTitle = quiz.title || quiz.name || 'تاقیکرن';
        const code = r.code || '';
        const name = r.fullName || r.name || '';
        const rc = r.resultCode || ('RS-' + r.studentCode);
        const score = r.score !== undefined ? r.score : 0;
        const total = r.total !== undefined ? r.total : 100;
        const timeTaken = r.time || '';
        const cheatCount = r.cheat !== undefined ? r.cheat : 0;
        const date = r.date || '';

        const row = [
          quizTitle,
          code,
          name,
          rc,
          score,
          total,
          timeTaken,
          cheatCount,
          date
        ];

        csvContent += row.map(val => `"${String(val).replace(/"/g, '""')}"`).join(',') + '\n';
      });

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.setAttribute('href', url);
      link.setAttribute('download', `QuizKurd_All_Results_${new Date().toISOString().slice(0, 10)}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      showToast('📤 ئەنجام ب سەرکەفتی هاتنە هەناردەکرن!');
    }

    function updateHeaderLogout() {
      const teacher = DB.getCurrTeacher();
      const wrap = document.getElementById('header-logout-wrap');
      if (wrap) {
        if (teacher) {
          wrap.innerHTML = `<button onclick="logoutTeacher()" class="text-[10px] font-bold px-2.5 py-1.5 bg-navyDark border border-white/10 rounded-xl text-gray-400 hover:text-white transition-all">ده‌ربازبوون</button>`;
        } else {
          wrap.innerHTML = `<div class="w-2"></div>`;
        }
      }
    }

    function showPage(page) {
      const secHome = document.getElementById('sec-home');
      const secEncam = document.getElementById('sec-encam');
      const secMamosta = document.getElementById('sec-mamosta');
      const secQuiz = document.getElementById('sec-quiz');
      const header = document.querySelector('header');

      if (secHome) secHome.classList.add('hidden');
      if (secEncam) secEncam.classList.add('hidden');
      if (secMamosta) secMamosta.classList.add('hidden');
      if (secQuiz) secQuiz.classList.add('hidden');

      // Update tab buttons to inactive state exactly as required in request 10
      document.querySelectorAll('.tab-btn').forEach(b => {
        b.className = "tab-btn text-gray-400 px-3 py-1.5 rounded-xl text-xs font-black transition-all hover:text-goldBright";
      });

      if (page === 'mamosta') {
        if (secMamosta) secMamosta.classList.remove('hidden');
        const btn = document.getElementById('btn-mamosta');
        if (btn) btn.className = "tab-btn bg-yellow-400 text-black px-3 py-1.5 rounded-xl text-xs font-black transition-all shadow-sm";
        if (header) header.classList.remove('hidden');
      } else if (page === 'encam') {
        if (secEncam) secEncam.classList.remove('hidden');
        const btn = document.getElementById('btn-encam');
        if (btn) btn.className = "tab-btn bg-yellow-400 text-black px-3 py-1.5 rounded-xl text-xs font-black transition-all shadow-sm";
        if (header) header.classList.remove('hidden');
      } else if (page === 'quiz') {
        if (secQuiz) secQuiz.classList.remove('hidden');
        if (header) header.classList.add('hidden'); // hide navigation during live quiz
      } else {
        if (secHome) secHome.classList.remove('hidden');
        const btn = document.getElementById('btn-taqikirin');
        if (btn) btn.className = "tab-btn bg-yellow-400 text-black px-3 py-1.5 rounded-xl text-xs font-black transition-all shadow-sm";
        if (header) header.classList.remove('hidden');
      }

      updateHeaderLogout();
    }

    // Router
    function renderRoute() {
      const hash = window.location.hash || '#/';
      const [rawPath, q] = hash.split('?');
      const path = decodeURIComponent(rawPath);
      const params = new URLSearchParams(q || '');

      if (path === '' || path === '#' || path === '#/') {
        const homeContent = document.getElementById('home-content');
        if (homeContent) homeContent.innerHTML = renderHome();
        showPage('home');
        return;
      }
      if (path === '#encam' || path === '#/encam') {
        const encamContent = document.getElementById('encam-content');
        if (encamContent) encamContent.innerHTML = renderResultsPage();
        showPage('encam');
        return;
      }
      const encamCodeMatch = path.match(/^#\/?encam\/([^/]+)$/);
      if (encamCodeMatch) {
        const c = decodeURIComponent(encamCodeMatch[1]);
        const encamContent = document.getElementById('encam-content');
        if (encamContent) encamContent.innerHTML = renderResultsPage(c);
        showPage('encam');
        return;
      }
      if (path === '#mamosta-veşarti-2026' || path === '#/mamosta-veşarti-2026' || path === '#mamosta' || path === '#/mamosta') {
        const mamostaContent = document.getElementById('mamosta-content');
        if (mamostaContent) mamostaContent.innerHTML = renderTeacherRoute();
        showPage('mamosta');
        return;
      }
      const resMatch = path.match(/^#\/?mamosta-veşarti-2026\/results\/([^/]+)$/) || path.match(/^#\/?mamosta\/results\/([^/]+)$/);
      if (resMatch) {
        const mamostaContent = document.getElementById('mamosta-content');
        if (mamostaContent) mamostaContent.innerHTML = renderTeacherResultsPage(decodeURIComponent(resMatch[1]));
        showPage('mamosta');
        return;
      }
      const qMatch = path.match(/^#\/?quiz\/([^/]+)$/);
      if (qMatch) {
        const code = decodeURIComponent(qMatch[1]);
        const fullName = params.get('fullName') || 'قوتابی';
        const quizContent = document.getElementById('quiz-content');
        if (quizContent) quizContent.innerHTML = renderQuizPlayer(code, fullName);
        showPage('quiz');
        return;
      }

      // Default fallback
      const homeContent = document.getElementById('home-content');
      if (homeContent) homeContent.innerHTML = renderHome();
      showPage('home');

      // Auto-render STEM formulas with KaTeX across questions & options
      setTimeout(() => {
        if (window.renderMathInElement) {
          try {
            renderMathInElement(document.body, {
              delimiters: [
                { left: '$$', right: '$$', display: true },
                { left: '$', right: '$', display: false }
              ],
              throwOnError: false
            });
          } catch(e) {}
        }
      }, 50);
    }

    window.addEventListener('DOMContentLoaded', () => {
      initSeed();
      renderRoute();
    });

    window.addEventListener('hashchange', () => {
      if (!window.location.hash.startsWith('#/quiz')) {
        if (quizTimer) clearInterval(quizTimer);
      }
      searchStatus = null;
      renderRoute();
    });
  </script>
</body>
